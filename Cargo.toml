[workspace]
resolver = "2"
members = [
    "backend",
    "shared",
    "mcp",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
futures-util = "0.3"
