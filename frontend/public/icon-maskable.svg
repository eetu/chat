  <g transform="translate(32 32) scale(0.6) translate(-32 -32)">
    <path d="M20 11H44a10 10 0 0 1 10 10V33a10 10 0 0 1-10 10H30l-10 10v-10a10 10 0 0 1-10-10V21a10 10 0 0 1 10-10z"
          stroke="#525252" stroke-width="3" fill="#ffffff"/>
    <circle cx="32" cy="27" r="6" fill="#f78f08"/>
  </g>
</svg>
