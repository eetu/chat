name: Create and publish a Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect build-relevant changes
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - 'backend/**'
              - 'frontend/**'
              - 'Dockerfile'
              - '.github/workflows/dockerimage.yaml'

      - name: Skip if no build-relevant changes
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
             || [[ "${{ github.ref }}" == refs/tags/v* ]] \
             || [[ "${{ steps.filter.outputs.build }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend/frontend/Dockerfile changes — skipping image build."
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: steps.gate.outputs.run == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAT_IMAGE_TAG=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          platforms: linux/arm64
          # Skip the provenance + SBOM attestations buildx attaches by
          # default. Each one becomes its own ghcr "version", inflating
          # the package version count 3× on every push for no real
          # benefit on a single-platform image.
          provenance: false
          sbom: false

      - name: Prune untagged image versions
        if: steps.gate.outputs.run == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: chat
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
