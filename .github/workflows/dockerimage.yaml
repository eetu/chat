name: Create and publish Docker images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The backend (web) image keeps the legacy `chat` name. The MCP
  # bridge ships as a sibling package `chat-mcp`. Both live under the
  # same repo namespace so a single GHCR login covers them.
  IMAGE_BACKEND: ${{ github.repository }}
  IMAGE_MCP: ${{ github.repository }}-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Detect build-relevant changes
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'frontend/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - '.github/workflows/dockerimage.yaml'
            mcp:
              - 'mcp/**'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - '.github/workflows/dockerimage.yaml'

      - name: Decide which images to build
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
             || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "mcp=${{ steps.filter.outputs.mcp }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.backend == 'true' || steps.gate.outputs.mcp == 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: "arm64"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.backend == 'true' || steps.gate.outputs.mcp == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to the Container registry
        if: steps.gate.outputs.backend == 'true' || steps.gate.outputs.mcp == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Backend image (web UI + actix-web) --
      - name: Extract metadata for backend image
        id: meta_backend
        if: steps.gate.outputs.backend == 'true'
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        if: steps.gate.outputs.backend == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          build-args: |
            CHAT_IMAGE_TAG=${{ fromJSON(steps.meta_backend.outputs.json).labels['org.opencontainers.image.created'] }}
          platforms: linux/arm64
          # Skip provenance + SBOM attestations: each one becomes its
          # own GHCR "version", inflating the package version count 3×
          # per push for no real benefit on a single-platform image.
          provenance: false
          sbom: false

      # -- MCP bridge image (stdio Rust binary) --
      - name: Extract metadata for mcp image
        id: meta_mcp
        if: steps.gate.outputs.mcp == 'true'
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push mcp image
        if: steps.gate.outputs.mcp == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: mcp-runner
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          platforms: linux/arm64
          provenance: false
          sbom: false

      # Prune untagged versions for both packages. Two delete-package
      # steps so each image's history is independently trimmed.
      - name: Prune untagged backend image versions
        if: steps.gate.outputs.backend == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: chat
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      - name: Prune untagged mcp image versions
        if: steps.gate.outputs.mcp == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: chat-mcp
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
